<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karma Textile | Toptan</title><style>
:root{--bg:#050505;--panel:#0b0907;--gold:#d8a94f;--gold2:#f1d08a;--text:#f5f0e8;--muted:#b7b0a6;--line:rgba(216,169,79,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:radial-gradient(circle at 20% 15%,rgba(216,169,79,.12),transparent 30%),radial-gradient(circle at 80% 60%,rgba(255,255,255,.05),transparent 32%),linear-gradient(125deg,transparent 30%,rgba(255,255,255,.025) 45%,transparent 60%)}
.container{width:min(1100px,92%);margin:auto}.gold{color:var(--gold2)}
.logo{width:min(250px,62vw);display:block;margin:0 auto 18px;border-radius:50%;box-shadow:0 0 50px rgba(216,169,79,.12)}
.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 0 35px;position:relative}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(216,169,79,.08),transparent 48%),repeating-linear-gradient(110deg,rgba(255,255,255,.015) 0 1px,transparent 1px 9px)}
.kicker{letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--gold2);margin-bottom:14px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400}h1{font-size:clamp(38px,8vw,72px);line-height:1.03;margin:0 0 16px}h1 span{color:var(--gold2)}
.lead{max-width:620px;margin:0 auto 35px;color:#d0cbc3;font-size:17px;line-height:1.7}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:900px;margin:auto}
.choice{position:relative;overflow:hidden;min-height:310px;border:1px solid var(--line);border-radius:24px;padding:34px 28px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:linear-gradient(145deg,rgba(35,28,20,.95),rgba(8,8,8,.96));box-shadow:0 20px 60px rgba(0,0,0,.35)}
.choice:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,rgba(216,169,79,.17),transparent 30%),linear-gradient(135deg,transparent,rgba(255,255,255,.025));pointer-events:none}
.icon{width:58px;height:58px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:25px;margin-bottom:auto}
.choice h2{font-size:36px;margin:20px 0 8px}.choice p{color:var(--muted);line-height:1.6;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:linear-gradient(110deg,#f3cd7f,#b9822c);color:#080706;text-decoration:none;font-weight:700;letter-spacing:.02em;padding:0 22px;transition:.2s}.btn:hover{transform:translateY(-2px)}
.scroll{margin-top:34px;color:var(--gold2);font-size:11px;letter-spacing:.25em;text-transform:uppercase}.scroll:after{content:"↓";display:block;font-size:25px;margin-top:8px}
.section{padding:80px 0;border-top:1px solid rgba(216,169,79,.2)}.section-head{text-align:center;margin-bottom:38px}.section-head h2{font-size:42px;margin:8px 0}.section-head p{color:var(--muted);max-width:650px;margin:auto;line-height:1.7}
.story{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:stretch}.story-card{border:1px solid var(--line);border-radius:24px;padding:34px;background:linear-gradient(145deg,#12100e,#070707)}.story-card h3{font-size:32px;margin:0 0 14px;color:var(--gold2)}.story-card p{color:#c4beb5;line-height:1.8}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.benefit{border-top:1px solid var(--line);padding:22px 8px;text-align:center}.benefit b{display:block;color:var(--gold2);font-size:13px;letter-spacing:.08em}.benefit span{display:block;color:#999188;font-size:12px;margin-top:7px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px}.contact-card{border:1px solid var(--line);border-radius:24px;padding:28px;background:#090807}.contact-row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.06)}.contact-row:last-child{border-bottom:0}.contact-row strong{display:block;color:var(--gold2);margin-bottom:4px}.contact-row span,.contact-row a{color:#c9c3bb;text-decoration:none;line-height:1.5}
.map{min-height:100%;border-radius:24px;border:1px solid var(--line);background:radial-gradient(circle at 60% 45%,rgba(216,169,79,.24) 0 3px,transparent 4px),repeating-linear-gradient(30deg,#0c0b0a 0 14px,#11100e 14px 16px);display:grid;place-items:center}.pin{font-size:52px;color:var(--gold2);text-align:center}.pin small{display:block;font-size:14px;color:#c9c3bb}
footer{padding:35px 0 45px;text-align:center;border-top:1px solid rgba(216,169,79,.18);color:#777068;font-size:12px;letter-spacing:.08em}
.subpage{min-height:100svh;padding:30px 0 70px}.subhead{text-align:center;padding:25px 0 40px}.subhead .logo{width:170px}.subhead h1{font-size:44px}.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px;margin:auto}.social-card{min-height:230px;border:1px solid var(--line);border-radius:24px;background:#0b0908;padding:28px;display:flex;flex-direction:column;justify-content:space-between}.social-symbol{height:58px;display:flex;align-items:center}.social-symbol img{max-width:58px;max-height:58px;display:block}.social-symbol img.trendyol-logo{max-width:150px;height:46px}.social-card h2{font-size:30px;margin:12px 0}.social-card p{color:var(--muted);line-height:1.6}
.back{display:inline-block;color:var(--gold2);text-decoration:none;margin-bottom:25px}.note{text-align:center;color:#777068;margin-top:28px;font-size:12px}
@media(max-width:720px){.choice-grid,.story,.contact,.social-grid{grid-template-columns:1fr}.choice{min-height:275px}.benefits{grid-template-columns:repeat(2,1fr)}.hero{padding-top:28px}.logo{width:min(210px,58vw)}.section{padding:62px 0}.map{min-height:240px}.choice h2{font-size:32px}}
